[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-results"
version = "1.0.0"
description = "Production-oriented REST API for sport results accounting"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Daria Naborska" }]
keywords = ["sport", "results", "fastapi", "rest-api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4",
    "mypy>=1.10",
    "ruff>=0.4",
    "build>=1.2",
]

[project.urls]
Repository = "https://github.com/dashanaborska/python_lab"

[project.scripts]
sport-results-api = "sport_results.main:main"
sport-results-client = "sport_results.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sport_results = ["py.typed", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["sport_results"]
omit = ["*/main.py", "*/client.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
