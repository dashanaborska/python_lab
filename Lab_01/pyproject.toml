[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-results"
version = "0.1.0"
description = "Sport results accounting laboratory project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daria Naborska" }]

[project.scripts]
sport-results = "sport_results.main:main"

[tool.setuptools.packages.find]
where = ["src"]
