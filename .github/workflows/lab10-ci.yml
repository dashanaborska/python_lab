name: Lab_10 CI

on:
  push:
    branches: [main]
    paths:
      - "Lab_10/**"
      - ".github/workflows/lab10-ci.yml"
  pull_request:
    paths:
      - "Lab_10/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: Lab_10

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Lab_10/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Tests with coverage
        run: pytest -v --cov=sport_results --cov-branch --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check dist
        run: ls -la dist

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import sport_results; print(sport_results.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sport-results-dist
          path: Lab_10/dist/

  docker:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t sport-results:ci -t sport-results:${{ github.sha }} .

      - name: Run container and check health
        run: |
          docker run -d --name sport-results -p 8000:8000 -e LOG_LEVEL=INFO sport-results:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs sport-results
          exit 1
