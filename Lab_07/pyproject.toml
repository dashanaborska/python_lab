[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-results"
version = "0.7.0"
description = "Sport results accounting with database persistence"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daria Naborska" }]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5", "mypy>=1.10"]

[project.scripts]
sport-results = "sport_results.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
