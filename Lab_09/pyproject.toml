[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-results"
version = "0.9.0"
description = "Profiling and optimization of sport results analytics"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daria Naborska" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "matplotlib>=3.8"]

[project.scripts]
sport-results = "sport_results.main:main"
sport-results-profile = "sport_results.profiling:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
