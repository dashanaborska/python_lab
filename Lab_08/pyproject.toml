[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-results"
version = "0.8.0"
description = "Asynchronous REST API for sport results accounting"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daria Naborska" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4", "pytest-cov>=5", "mypy>=1.10"]

[project.scripts]
sport-results-api = "sport_results.main:main"
sport-results-client = "sport_results.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["sport_results"]
omit = ["*/main.py", "*/client.py"]
