[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-results"
version = "0.3.0"
description = "Streaming processing of sport results"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daria Naborska" }]

[project.scripts]
sport-results = "sport_results.main:main"
sport-results-generate = "sport_results.generator:main"
sport-results-experiment = "sport_results.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]
